# Tag a `v*` release -> cross-compile binaries for every platform, publish a
# GitHub Release with checksums, and push a multi-arch image to GHCR.
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# Requires Settings -> Actions -> General -> Workflow permissions = Read and write.

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release, e.g. v0.1.0"
        required: true
        type: string

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  # VERSION is only used for asset naming / the release tag.
  VERSION: ${{ github.event.inputs.tag || github.ref_name }}
  # REF is what every job checks out. Use the actual trigger ref so a
  # workflow_dispatch on main builds the CURRENT code (incl. Dockerfile fixes),
  # not the stale commit that a still-pointing tag refers to.
  REF: ${{ github.ref }}
  BIN: matrix-satori

jobs:
  # Linux targets via cross (musl = static, no runtime deps).
  linux:
    name: build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
          - armv7-unknown-linux-musleabihf
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.REF }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cross
      - name: Build
        run: cross build --release --target ${{ matrix.target }}
      - name: Package
        run: |
          set -euo pipefail
          stage="dist/${BIN}_${VERSION}_${{ matrix.target }}"
          mkdir -p "$stage"
          cp "target/${{ matrix.target }}/release/${BIN}" "$stage/"
          cp README.md LICENSE "$stage/"
          tar -czf "dist/${BIN}_${VERSION}_${{ matrix.target }}.tar.gz" -C dist "$(basename "$stage")"
          (cd dist && sha256sum "${BIN}_${VERSION}_${{ matrix.target }}.tar.gz" > "${BIN}_${VERSION}_${{ matrix.target }}.tar.gz.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BIN }}-${{ matrix.target }}
          path: dist/${{ env.BIN }}_*.*
          if-no-files-found: error

  # Windows x86_64.
  windows:
    name: build x86_64-pc-windows-msvc
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.REF }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Build
        run: cargo build --release --target x86_64-pc-windows-msvc
      - name: Package
        shell: pwsh
        run: |
          $stage = "dist/${env:BIN}_${env:VERSION}_x86_64-pc-windows-msvc"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "target/x86_64-pc-windows-msvc/release/${env:BIN}.exe" $stage
          Copy-Item README.md, LICENSE $stage
          Compress-Archive -Path $stage -DestinationPath "dist/${env:BIN}_${env:VERSION}_x86_64-pc-windows-msvc.zip"
          $h = (Get-FileHash "dist/${env:BIN}_${env:VERSION}_x86_64-pc-windows-msvc.zip" -Algorithm SHA256).Hash.ToLower()
          "$h  ${env:BIN}_${env:VERSION}_x86_64-pc-windows-msvc.zip" | Out-File -Encoding ascii "dist/${env:BIN}_${env:VERSION}_x86_64-pc-windows-msvc.zip.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BIN }}-x86_64-pc-windows-msvc
          path: dist/${{ env.BIN }}_*.*
          if-no-files-found: error

  release:
    name: publish release
    needs: [linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Aggregate checksums
        run: |
          cd dist
          cat *.sha256 > SHA256SUMS
          rm -f *.sha256
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: matrix-satori ${{ env.VERSION }}
          generate_release_notes: true
          files: dist/*
          fail_on_unmatched_files: true

  docker:
    name: publish docker image
    needs: [release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.REF }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Lowercase image name
        id: image
        run: echo "name=ghcr.io/$(printf '%s' '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=${{ env.VERSION }}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
