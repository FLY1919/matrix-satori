[package]
name = "matrix-satori"
version = "0.2.4"
edition = "2021"
description = "A Satori protocol server backed by Matrix, usable from Koishi via adapter-satori"
license = "MIT"
repository = "https://github.com/FLY1919/matrix-satori"

[[bin]]
name = "matrix-satori"
path = "src/main.rs"

[lib]
name = "matrix_satori"
path = "src/lib.rs"

[dependencies]
axum = { version = "0.7", features = ["ws", "macros", "multipart"] }
tokio = { version = "1", features = ["full", "signal"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip", "multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive", "env"] }
futures = "0.3"
thiserror = "1"
anyhow = "1"
uuid = { version = "1", features = ["v4"] }
url = "2"
regex = "1"
# E2EE: 官方 matrix-sdk，抄它的 Client + sync 自动解密
# sqlite + bundled-sqlite: 密钥落到本地 store，重启后仍能解密；bundled 避免 musl 交叉编译时缺系统 sqlite 库
matrix-sdk = { version = "0.18", default-features = false, features = ["e2e-encryption", "automatic-room-key-forwarding", "sqlite", "bundled-sqlite"] }

[dev-dependencies]
tokio-tungstenite = { version = "0.21", features = ["connect"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
